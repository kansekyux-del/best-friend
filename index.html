<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구굴</title>
<style>
:root{--bg:#fff;--fg:#202124;--sub:#5f6368;--line:#dfe1e5;--link:#1a0dab;--url:#188038;--hover:#f1f3f4;--accent:#4285f4;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--fg:#e8eaed;--sub:#9aa0a6;--line:#5f6368;--link:#8ab4f8;--url:#81c995;--hover:#303134;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#202124;--fg:#e8eaed;--sub:#9aa0a6;--line:#5f6368;--link:#8ab4f8;--url:#81c995;--hover:#303134;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.logo{font-weight:700;user-select:none;cursor:pointer}
.logo b:nth-child(1){color:#4285f4}.logo b:nth-child(2){color:#ea4335}.logo b:nth-child(3){color:#fbbc05}
.sbox{position:relative;width:100%}
.bar{display:flex;align-items:center;border:1px solid var(--line);border-radius:26px;padding:0 18px;background:var(--bg)}
.bar input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font-family:inherit}
.bar svg{fill:var(--sub);flex:none}
.bar .go{cursor:pointer}
.sug{display:none;position:absolute;left:0;right:0;background:var(--bg);box-shadow:0 4px 6px rgba(0,0,0,.28);padding:4px 0 12px;z-index:5}
.sug.open{display:block}
.sug div{display:flex;gap:14px;align-items:center;padding:8px 18px;cursor:pointer;font-size:15px}
.sug div.on,.sug div:hover{background:var(--hover)}
.sug svg{width:16px;height:16px;fill:var(--sub)}
/* home */
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 8vh}
#home .logo{font-size:72px;letter-spacing:-3px;margin-bottom:28px}
#home .sbox{max-width:580px}
#home .bar{height:52px}
#home .bar:hover,#home .bar.open,#home .bar:focus-within{box-shadow:0 1px 6px rgba(0,0,0,.28);border-color:transparent}
#home .bar.open{border-radius:26px 26px 0 0}
#home .bar input{font-size:17px;margin-left:14px}
#home .bar svg{width:20px;height:20px}
#home .sug{top:52px;border-radius:0 0 26px 26px}
.btns{margin-top:26px;display:flex;gap:12px}
.btns button{background:var(--hover);color:var(--fg);border:1px solid var(--hover);border-radius:4px;padding:10px 16px;font-size:14px;font-family:inherit;cursor:pointer}
/* results */
#res{display:none}
header{display:flex;align-items:center;gap:28px;padding:20px 24px 0;flex-wrap:wrap}
header .logo{font-size:30px;letter-spacing:-1px}
header .sbox{flex:1;max-width:620px;min-width:260px}
header .bar{height:46px;border-radius:24px;padding:0 16px}
header .bar.open{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent;box-shadow:0 2px 6px rgba(0,0,0,.25)}
header .bar input{font-size:16px}
header .bar svg{width:18px;height:18px}
header .go{margin-left:10px}
header .sug{top:46px;border:1px solid var(--line);border-top:0;border-radius:0 0 24px 24px}
nav{display:flex;gap:22px;padding:12px 24px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--sub);margin-top:6px}
nav span{padding:8px 2px 10px}nav .cur{color:var(--accent);border-bottom:3px solid var(--accent)}
main{max-width:680px;padding:14px 24px 60px}
@media(min-width:900px){main{margin-left:150px}}
.cnt{font-size:13px;color:var(--sub);margin-bottom:18px}
.r{margin-bottom:26px}
.r .u{font-size:13px;color:var(--url);margin-bottom:2px}
.r a{font-size:19px;color:var(--link);text-decoration:none;line-height:1.3;display:block;cursor:pointer}
.r a:hover{text-decoration:underline}
.r p{margin:4px 0 0;font-size:14px;line-height:1.55;color:var(--sub)}
.r p b{color:var(--fg)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:6px;color:var(--sub)}
.pg{display:flex;gap:14px;color:var(--link);font-size:15px;margin-top:10px}
.pg span:first-child{color:var(--fg);font-weight:700}
.sp{padding-top:6px}
.sp .lab{font-size:13px;color:var(--sub);margin-bottom:14px}
.sp .imgs{display:flex;gap:14px;flex-wrap:wrap}
.sp img{max-width:100%;max-height:520px;border-radius:10px;display:block}
.sp .imgs.two img{max-width:calc(50% - 7px)}
.sp .msg{font-size:26px;line-height:1.7;font-weight:700;padding:28px 26px;border:1px solid var(--line);border-radius:14px;max-width:560px}
.sp .msg small{display:block;margin-top:10px;font-size:14px;font-weight:400;color:var(--sub)}
</style>
</head>

      <div class="sug"></div>
    </div>
  </header>
  <nav><span class="cur">전체</span><span>게시글</span><span>뉴스</span><span>이미지</span><span>동영상</span><span>지식Q&amp;A</span></nav>
  <main>

  var first = JUNK[0];
  if(PIN_FIRST_SEARCH && searchCount === 0){ list.unshift(first); }
  else { list = shuffle(list.concat([first])).slice(0, SHOWN); }
  return list;
}
function buildReport(){
  var cafe = REPORT[3];
  var others = shuffle(REPORT.slice(0,3).concat(REPORT.slice(4), NEWS_EXTRA)).slice(0,5);
  others.splice(3, 0, cafe);   // 카페 글은 항상 4번째
  return others;
}

/* ===== 특별 검색어 (이름을 검색하면 이미지/메시지가 뜹니다) =====
   keys: 검색어에 이 글자가 들어 있으면 작동 (띄어쓰기 무시)
   imgs: images 폴더 안의 파일명 / msg: 표시할 메시지(줄바꿈은 배열로) */
var SPECIAL = [
  { keys:["김예림"], imgs:["images/images.jpeg"] },
  { keys:["류태영"], imgs:["images/images2.png"] },
  { keys:["강성은"], imgs:["images/image3.jpeg","images/images4.jpeg"] },
  { keys:["강주은","박채영"], msg:["배우님들 감사합니다.","오늘 촬영 잘 부탁드리고..","류태영 WS2 화이팅!"] }
];
function renderSpecial(term){
  var flat = term.replace(/\s+/g,"");
  var pg = document.querySelector(".pg");
  for(var i=0;i<SPECIAL.length;i++){
    var s = SPECIAL[i];
    if(s.keys.some(function(k){return flat.indexOf(k)>-1})){
      var html = '<div class="sp">';
      if(s.imgs){
        html += '<div class="imgs'+(s.imgs.length>1?' two':'')+'">'+s.imgs.map(function(p){return '<img src="'+p+'" alt="">'}).join("")+'</div>';
      } else {
        html += '<div class="msg">'+s.msg.join("<br>")+'</div>';
      }
      html += '</div>';
      document.getElementById("cnt").textContent = s.imgs ? "'"+term+"' 이미지 검색결과" : "";
      document.getElementById("list").innerHTML = html;
      pg.style.display = "none";
      document.title = term+" - 구굴 검색";
      window.scrollTo(0,0);
      return true;
    }
  }
  pg.style.display = "";
  return false;
}

/* ===== 동작 ===== */
var ico='<svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>';
var home=document.getElementById("home"), res=document.getElementById("res");
function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

function render(term){
  if(renderSpecial(term)) return;
  var isReport = term.replace(/\s+/g,"") === TRIGGER;
  var data = isReport ? buildReport() : buildJunk(term);
  document.getElementById("cnt").textContent = "'"+term+"' 검색결과 약 "+rnd(isReport?1500:2800, isReport?2400:4200)+"개 (0."+rnd(28,57)+"초)";
  searchCount++;
  document.getElementById("list").innerHTML = data.map(function(r){
    var title = r[3]
      ? '<a href="'+r[3]+'" target="_blank" rel="noopener">'+r[1]+'</a>'
      : '<a href="#" onclick="return false">'+r[1]+'</a>';
    var src = isReport ? r[0] : r[0]+' › board › view';
    return '<div class="r"><div class="u">'+src+'</div>'+title+'<p>'+r[2]+'</p></div>';
  }).join("");
  document.title = term+" - 구굴 검색";
  window.scrollTo(0,0);
}
function go(term){
  term = term.trim(); if(!term) return;
  home.style.display="none"; res.style.display="block";
  res.querySelector("input").value = term;
  render(term);
}
function toHome(){
  res.style.display="none"; home.style.display="flex";
  var i=home.querySelector("input"); i.value=""; i.focus(); document.title="구굴";
}

/* 검색창 + 자동완성 (홈/결과 화면 공통) */
Array.prototype.forEach.call(document.querySelectorAll("[data-s]"),function(box){
  var input=box.querySelector("input"), bar=box.querySelector(".bar"), sug=box.querySelector(".sug"), idx=-1, cur=[];
  function close(){sug.classList.remove("open");bar.classList.remove("open")}
  function show(){
    var v=input.value.trim();
    cur=v?SUG.filter(function(s){return s.indexOf(v)===0&&s!==v}):[];
    idx=-1;
    sug.innerHTML=cur.map(function(s){return '<div>'+ico+'<span>'+esc(s)+'</span></div>'}).join("");
    var open=cur.length>0;
    sug.classList.toggle("open",open); bar.classList.toggle("open",open);
    Array.prototype.forEach.call(sug.children,function(el,i){
      el.onmousedown=function(e){e.preventDefault();input.value=cur[i];close();go(cur[i])};
    });
  }
  function mark(){Array.prototype.forEach.call(sug.children,function(el,i){el.classList.toggle("on",i===idx)})}
  function submit(){
    if(idx>=0&&cur[idx])input.value=cur[idx];
    close(); go(input.value); input.blur();
  }
  input.addEventListener("input",show);
  input.addEventListener("focus",function(){input.select()});
  input.addEventListener("blur",close);
  input.addEventListener("keydown",function(e){
    if(e.key==="Enter")submit();
    else if(e.key==="ArrowDown"&&cur.length){e.preventDefault();idx=(idx+1)%cur.length;mark()}
    else if(e.key==="ArrowUp"&&cur.length){e.preventDefault();idx=(idx<=0?cur.length:idx)-1;mark()}
    else if(e.key==="Escape")close();
  });
  var g=box.querySelector(".go"); if(g)g.onclick=submit;
});
document.getElementById("b1").onclick=function(){go(home.querySelector("input").value)};
document.getElementById("homelogo").onclick=toHome;
document.getElementById("reslogo").onclick=toHome;
</script>
